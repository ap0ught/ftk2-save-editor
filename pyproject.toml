[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ftk2-save-editor"
version = "0.1.0"
description = "Read and edit For The King II (FTK2) User.ftk2 save files"
authors = [{name = "Hermes Agent"}]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
ftk2-edit = "ftk2_editor.cli:main"
ftk2-gui = "ftk2_editor.gui:main"